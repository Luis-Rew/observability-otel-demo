server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# Em vez de apontar para um arquivo de log específico, o Promtail descobre
# os containers rodando via socket do Docker e já anexa labels úteis
# automaticamente (nome do container, imagem, etc) — é assim que se coleta
# logs de uma stack inteira sem configurar cada serviço individualmente.
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
